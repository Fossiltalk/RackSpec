<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RackSpec Designer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d1117;
      --surface:  #161b22;
      --surface2: #1c2128;
      --border:   #30363d;
      --text:     #e6edf3;
      --muted:    #8b949e;
      --accent:   #388bfd;
      --success:  #3fb950;
      --error:    #f85149;
      --radius:   6px;
      --mono:     'JetBrains Mono', 'Fira Mono', ui-monospace, monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    header h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.02em; }
    header .sep { color: var(--border); }
    header a {
      color: var(--muted);
      font-size: 12px;
      text-decoration: none;
      transition: color 0.1s;
    }
    header a:hover { color: var(--accent); }
    header .spacer { flex: 1; }

    /* ── App grid ── */
    .app {
      flex: 1;
      display: grid;
      grid-template-columns: 260px 1fr 260px;
      overflow: hidden;
      min-height: 0;
    }

    /* ── Shared panel ── */
    .panel-header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      flex-shrink: 0;
    }

    /* ── Left: Ribbon browser ── */
    .browser {
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .browser-search {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .browser-search input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 12px;
      outline: none;
      padding: 5px 8px;
    }
    .browser-search input:focus { border-color: var(--accent); }
    .browser-search input::placeholder { color: var(--muted); }

    .browser-filter {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 11px;
      outline: none;
      padding: 5px 6px;
    }

    .ribbon-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
    }

    .ribbon-group-label {
      padding: 8px 12px 4px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 1;
    }

    .ribbon-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 12px;
      cursor: pointer;
      transition: background 0.07s;
    }
    .ribbon-item:hover { background: var(--surface); }
    .ribbon-item:active { background: var(--surface2); }

    .ribbon-item .preview {
      flex-shrink: 0;
      line-height: 0;
      border-radius: 2px;
      overflow: hidden;
    }

    .ribbon-item .name {
      font-size: 11px;
      color: var(--text);
      line-height: 1.3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Center: Builder ── */
    .builder {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    /* Settings bar */
    .settings-bar {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .settings-bar label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .seg-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
      padding: 3px 8px;
      transition: all 0.1s;
    }
    .seg-btn + .seg-btn { margin-left: -1px; border-radius: 0; }
    .seg-btn:first-of-type { border-radius: var(--radius) 0 0 var(--radius); }
    .seg-btn:last-of-type  { border-radius: 0 var(--radius) var(--radius) 0; }
    .seg-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; z-index: 1; position: relative; }
    .seg-btn:hover:not(.active) { border-color: var(--muted); color: var(--text); }

    select.setting-select {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 11px;
      outline: none;
      padding: 3px 6px;
    }

    /* Preview area */
    .preview-area {
      border-bottom: 1px solid var(--border);
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 120px;
      max-height: 240px;
      flex-shrink: 0;
      background:
        repeating-conic-gradient(#1e2430 0% 25%, #252c3a 0% 50%)
        0 0 / 16px 16px;
      overflow: auto;
    }

    .preview-area svg { display: block; max-width: 100%; }

    .preview-empty {
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    /* Rack rows editor */
    .rows-area {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
    }

    .rack-row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .rack-row.empty { border-style: dashed; opacity: 0.6; }

    .ribbon-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1.5px solid var(--border);
      border-radius: 4px;
      padding: 3px 6px 3px 4px;
      cursor: pointer;
      transition: border-color 0.1s, background 0.1s;
      background: var(--bg);
    }
    .ribbon-chip:hover { border-color: var(--muted); }
    .ribbon-chip.selected { border-color: var(--accent); background: var(--surface2); }

    .ribbon-chip .chip-strip {
      line-height: 0;
      flex-shrink: 0;
      border-radius: 1px;
      overflow: hidden;
    }

    .ribbon-chip .chip-name {
      font-size: 10px;
      color: var(--text);
      max-width: 90px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .row-del {
      margin-left: auto;
      flex-shrink: 0;
      background: none;
      border: 1px solid transparent;
      border-radius: var(--radius);
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
      padding: 2px 6px;
      transition: color 0.1s, border-color 0.1s;
    }
    .row-del:hover { color: var(--error); border-color: var(--error); }

    .add-row-btn {
      align-self: flex-start;
      background: none;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
      padding: 5px 12px;
      transition: color 0.1s, border-color 0.1s;
    }
    .add-row-btn:hover { color: var(--accent); border-color: var(--accent); }

    /* DSL output bar */
    .dsl-bar {
      border-top: 1px solid var(--border);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .dsl-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      flex-shrink: 0;
    }

    .dsl-text {
      flex: 1;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .action-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
      padding: 3px 8px;
      text-decoration: none;
      transition: color 0.1s, border-color 0.1s;
      flex-shrink: 0;
    }
    .action-btn:hover { color: var(--text); border-color: var(--muted); }

    /* ── Right: Device editor ── */
    .device-editor {
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .device-editor-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
    }

    .de-empty {
      color: var(--muted);
      font-size: 11px;
      text-align: center;
      padding: 24px 12px;
      line-height: 1.6;
    }

    .de-ribbon-name {
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .de-ribbon-id {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .de-section {
      margin-bottom: 14px;
    }

    .de-section-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .de-field {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .de-field label {
      font-size: 12px;
      color: var(--text);
    }

    .de-field input[type="checkbox"] {
      width: 14px;
      height: 14px;
      cursor: pointer;
      accent-color: var(--accent);
    }

    .de-field input[type="number"] {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 12px;
      padding: 2px 6px;
      width: 56px;
      text-align: center;
      outline: none;
    }
    .de-field input[type="number"]:focus { border-color: var(--accent); }

    .de-field select {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 11px;
      outline: none;
      padding: 2px 4px;
    }

    .de-divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 12px 0;
    }

    .de-move-row {
      display: flex;
      gap: 4px;
      margin-bottom: 12px;
    }

    .de-btn {
      flex: 1;
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      padding: 4px;
      transition: all 0.1s;
    }
    .de-btn:hover { border-color: var(--muted); color: var(--text); }
    .de-btn.danger:hover { border-color: var(--error); color: var(--error); }

    /* Scrollbar styling */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
  </style>
</head>
<body>

<header>
  <h1>RackSpec Designer</h1>
  <span class="sep">·</span>
  <a href="index.html">← Preview</a>
  <div class="spacer"></div>
  <span style="font-size:11px;color:var(--muted)">Click a ribbon to add it to the rack</span>
</header>

<div class="app">

  <!-- ── LEFT: Ribbon browser ── -->
  <aside class="browser">
    <div class="panel-header">Ribbon Browser</div>
    <div class="browser-search">
      <input type="search" id="search-input" placeholder="Search by name or ID…" autocomplete="off">
      <select class="browser-filter" id="branch-filter">
        <option value="all">All</option>
        <option value="joint">Joint</option>
        <option value="us-army">Army</option>
        <option value="us-navy">Navy</option>
      </select>
    </div>
    <div class="ribbon-list" id="ribbon-list"></div>
  </aside>

  <!-- ── CENTER: Builder ── -->
  <main class="builder">
    <div class="settings-bar">
      <label>
        Branch
        <select class="setting-select" id="dsl-branch">
          <option value="us-army">US Army</option>
          <option value="us-navy">US Navy</option>
          <option value="us-usmc">US Marine Corps</option>
          <option value="us-af">US Air Force</option>
          <option value="us-ssf">US Space Force</option>
          <option value="us-uscg">US Coast Guard</option>
        </select>
      </label>
      <label>
        Row width
        <button class="seg-btn active" data-rw="3">3</button>
        <button class="seg-btn" data-rw="4">4</button>
      </label>
      <label>
        Alignment
        <button class="seg-btn active" data-ra="c">Center</button>
        <button class="seg-btn" data-ra="l">Left</button>
        <button class="seg-btn" data-ra="r">Right</button>
      </label>
    </div>

    <div class="preview-area" id="preview-area">
      <div class="preview-empty" id="preview-empty">Add ribbons to see a preview</div>
    </div>

    <div class="rows-area" id="rows-area"></div>

    <div class="dsl-bar">
      <span class="dsl-label">DSL</span>
      <code class="dsl-text" id="dsl-text">—</code>
      <button class="action-btn" id="copy-dsl">Copy</button>
      <button class="action-btn" id="open-in-editor">Open in Editor</button>
    </div>
  </main>

  <!-- ── RIGHT: Device editor ── -->
  <aside class="device-editor">
    <div class="panel-header">Device Editor</div>
    <div class="device-editor-body" id="device-editor-body">
      <div class="de-empty">Click a ribbon chip in the rack to configure its devices and awards.</div>
    </div>
  </aside>

</div>

<script type="module">
import { ALL_RIBBONS, PALETTE, render } from './rackspec.js';

// ── Helpers ─────────────────────────────────────────────────────────────────

function resolveColor(c) {
  if (c && c.startsWith('$')) return PALETTE[c.slice(1)] ?? '#CCCCCC';
  return c ?? '#CCCCCC';
}

function miniSVG(stripes, w, h) {
  if (!stripes || stripes.length === 0)
    return `<svg width="${w}" height="${h}"><rect width="${w}" height="${h}" fill="#CCCCCC"/></svg>`;
  const total = stripes.reduce((s, st) => s + st.width, 0);
  let x = 0;
  const rects = stripes.map(st => {
    const sw = (st.width / total) * w;
    const r = `<rect x="${x.toFixed(2)}" y="0" width="${(sw + 0.5).toFixed(2)}" height="${h}" fill="${resolveColor(st.color)}"/>`;
    x += sw;
    return r;
  }).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block">${rects}</svg>`;
}

function defaultDevices() {
  return { vd: false, olcb: 0, olcs: false, stcb: 0, stcs: 0, stg: 0, sts: false, knt: 0, frame: 'none', posOverride: 'auto' };
}

// Ribbon lookup
const ribbonMap = new Map(ALL_RIBBONS.map(r => [r.id, r]));

function ribbonName(id) {
  return ribbonMap.get(id)?.name ?? id;
}

function ribbonStripes(id) {
  return ribbonMap.get(id)?.stripes ?? [];
}

// ── DSL generation ───────────────────────────────────────────────────────────

function buildDecorations(dev) {
  const tokens = [];
  if (dev.frame && dev.frame !== 'none') tokens.push(`@f:${dev.frame}`);
  if (dev.vd) tokens.push('vd');
  if (dev.olcs) tokens.push('olcs');
  const pos = (dev.posOverride && dev.posOverride !== 'auto') ? `@${dev.posOverride}` : '';
  if (dev.olcb > 0) tokens.push(`olcb${dev.olcb}${pos}`);
  if (dev.stcs > 0) tokens.push(`stcs${dev.stcs}`);
  if (dev.stcb > 0) tokens.push(`stcb${dev.stcb}${pos}`);
  if (dev.sts) tokens.push('sts');
  if (dev.stg > 0) tokens.push(`stg${dev.stg}`);
  if (dev.knt > 0) tokens.push(`kntb${dev.knt}`);
  return tokens.join('.');
}

function generateDSL() {
  if (state.rows.every(r => r.length === 0)) return '';
  const rowBlock = state.rows
    .filter(r => r.length > 0)
    .map(row => row.map(slot => {
      const decs = buildDecorations(slot.devices);
      return decs ? `${slot.id}~${decs}` : slot.id;
    }).join(','))
    .join('|');
  return `rack/v1;br:${state.branch};ut:service;rw:${state.rowWidth};ra:${state.alignment};${rowBlock}`;
}

// ── State ────────────────────────────────────────────────────────────────────

const state = {
  branch: 'us-army',
  rowWidth: 3,
  alignment: 'c',
  rows: [],
  selected: null,  // { rowIdx, colIdx }
};

let previewTimer = null;

function schedulePreview() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(renderPreview, 50);
}

// ── Preview ──────────────────────────────────────────────────────────────────

function renderPreview() {
  const dsl = generateDSL();
  const area = document.getElementById('preview-area');
  const empty = document.getElementById('preview-empty');

  // Update DSL bar
  const dslText = document.getElementById('dsl-text');
  dslText.textContent = dsl || '—';

  if (!dsl) {
    area.innerHTML = '';
    area.appendChild(empty);
    empty.style.display = '';
    return;
  }

  empty.style.display = 'none';
  try {
    const svg = render(dsl);
    area.innerHTML = svg;
  } catch (err) {
    area.innerHTML = `<span style="color:var(--error);font-size:11px">${err.message ?? err}</span>`;
  }
}

// ── Ribbon browser ───────────────────────────────────────────────────────────

function groupRibbons(query, branchFilter) {
  const q = query.toLowerCase();
  const filtered = ALL_RIBBONS.filter(r => {
    const matchQuery = !q || r.name.toLowerCase().includes(q) || r.id.includes(q);
    let matchBranch = true;
    if (branchFilter === 'joint') matchBranch = r.branch.length >= 4;
    else if (branchFilter === 'us-army') matchBranch = r.branch.includes('us-army') && r.branch.length < 4;
    else if (branchFilter === 'us-navy') matchBranch = r.branch.includes('us-navy') && r.branch.length < 4;
    return matchQuery && matchBranch;
  });

  const groups = [
    { label: 'Joint / All Branches', ribbons: filtered.filter(r => r.branch.length >= 4) },
    { label: 'US Army',              ribbons: filtered.filter(r => r.branch.includes('us-army') && r.branch.length < 4) },
    { label: 'US Navy / USMC',       ribbons: filtered.filter(r => r.branch.includes('us-navy') && r.branch.length < 4) },
  ];
  return groups.filter(g => g.ribbons.length > 0);
}

function renderBrowser() {
  const query = document.getElementById('search-input').value;
  const filter = document.getElementById('branch-filter').value;
  const groups = groupRibbons(query, filter);
  const list = document.getElementById('ribbon-list');
  list.innerHTML = '';

  for (const group of groups) {
    const label = document.createElement('div');
    label.className = 'ribbon-group-label';
    label.textContent = group.label;
    list.appendChild(label);

    for (const r of group.ribbons) {
      const item = document.createElement('div');
      item.className = 'ribbon-item';
      item.title = r.id;

      const preview = document.createElement('span');
      preview.className = 'preview';
      preview.innerHTML = miniSVG(r.stripes, 48, 14);

      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = r.name;

      item.appendChild(preview);
      item.appendChild(name);
      item.addEventListener('click', () => addRibbon(r.id));
      list.appendChild(item);
    }
  }

  if (list.children.length === 0) {
    list.innerHTML = `<div style="padding:16px 12px;color:var(--muted);font-size:11px">No ribbons match.</div>`;
  }
}

// ── Rack rows renderer ───────────────────────────────────────────────────────

function renderRows() {
  const area = document.getElementById('rows-area');
  area.innerHTML = '';

  if (state.rows.length === 0) {
    area.innerHTML = `<div style="color:var(--muted);font-size:11px;padding:8px 2px">Click a ribbon in the browser to start building your rack. Rows fill left to right; a new row is created when the current row is full.</div>`;
    return;
  }

  state.rows.forEach((row, rowIdx) => {
    const rowEl = document.createElement('div');
    rowEl.className = 'rack-row' + (row.length === 0 ? ' empty' : '');

    const rowLabel = document.createElement('span');
    rowLabel.style.cssText = 'font-size:10px;color:var(--muted);font-weight:600;flex-shrink:0;min-width:40px';
    rowLabel.textContent = `Row ${rowIdx + 1}`;
    rowEl.appendChild(rowLabel);

    if (row.length === 0) {
      const hint = document.createElement('span');
      hint.style.cssText = 'font-size:10px;color:var(--muted)';
      hint.textContent = 'empty — click to delete';
      rowEl.appendChild(hint);
    } else {
      row.forEach((slot, colIdx) => {
        const chip = document.createElement('div');
        const isSelected = state.selected && state.selected.rowIdx === rowIdx && state.selected.colIdx === colIdx;
        chip.className = 'ribbon-chip' + (isSelected ? ' selected' : '');
        chip.title = ribbonName(slot.id);

        const strip = document.createElement('span');
        strip.className = 'chip-strip';
        strip.innerHTML = miniSVG(ribbonStripes(slot.id), 44, 12);

        const chipName = document.createElement('span');
        chipName.className = 'chip-name';
        // Use a short form: last word of name, or first 12 chars
        const name = ribbonName(slot.id);
        const words = name.split(' ');
        chipName.textContent = words.length > 2 ? words.slice(-2).join(' ') : name;

        chip.appendChild(strip);
        chip.appendChild(chipName);
        chip.addEventListener('click', () => selectRibbon(rowIdx, colIdx));
        rowEl.appendChild(chip);
      });
    }

    const delBtn = document.createElement('button');
    delBtn.className = 'row-del';
    delBtn.textContent = '✕';
    delBtn.title = 'Delete row';
    delBtn.addEventListener('click', () => deleteRow(rowIdx));
    rowEl.appendChild(delBtn);

    area.appendChild(rowEl);
  });

  // Add row button
  const addBtn = document.createElement('button');
  addBtn.className = 'add-row-btn';
  addBtn.textContent = '+ Add Row';
  addBtn.addEventListener('click', addEmptyRow);
  area.appendChild(addBtn);
}

// ── Device editor ────────────────────────────────────────────────────────────

function renderDeviceEditor() {
  const body = document.getElementById('device-editor-body');
  if (!state.selected) {
    body.innerHTML = `<div class="de-empty">Click a ribbon chip in the rack to configure its devices and awards.</div>`;
    return;
  }

  const { rowIdx, colIdx } = state.selected;
  const slot = state.rows[rowIdx]?.[colIdx];
  if (!slot) { state.selected = null; renderDeviceEditor(); return; }

  const dev = slot.devices;
  const name = ribbonName(slot.id);

  body.innerHTML = `
    <div class="de-ribbon-name">${name}</div>
    <div class="de-ribbon-id">${slot.id}</div>

    <div class="de-move-row">
      <button class="de-btn" id="de-mv-left" title="Move earlier">◀</button>
      <button class="de-btn" id="de-mv-right" title="Move later">▶</button>
      <button class="de-btn danger" id="de-remove" title="Remove ribbon">✕ Remove</button>
    </div>

    <hr class="de-divider">

    <div class="de-section">
      <div class="de-section-label">Valor / Citation</div>
      <div class="de-field">
        <label for="dev-vd">V device (Valor)</label>
        <input type="checkbox" id="dev-vd" ${dev.vd ? 'checked' : ''}>
      </div>
      <div class="de-field">
        <label for="dev-frame">Frame</label>
        <select id="dev-frame">
          <option value="none" ${dev.frame === 'none' ? 'selected' : ''}>None</option>
          <option value="gold" ${dev.frame === 'gold' ? 'selected' : ''}>Gold (Unit Award)</option>
          <option value="silver" ${dev.frame === 'silver' ? 'selected' : ''}>Silver</option>
        </select>
      </div>
    </div>

    <div class="de-section">
      <div class="de-section-label">Oak Leaf Clusters</div>
      <div class="de-field">
        <label for="dev-olcb">Bronze OLC count</label>
        <input type="number" id="dev-olcb" min="0" max="9" value="${dev.olcb}">
      </div>
      <div class="de-field">
        <label for="dev-olcs">Silver OLC</label>
        <input type="checkbox" id="dev-olcs" ${dev.olcs ? 'checked' : ''}>
      </div>
    </div>

    <div class="de-section">
      <div class="de-section-label">Campaign Stars</div>
      <div class="de-field">
        <label for="dev-stcb">Bronze campaign stars</label>
        <input type="number" id="dev-stcb" min="0" max="9" value="${dev.stcb}">
      </div>
      <div class="de-field">
        <label for="dev-stcs">Silver campaign stars</label>
        <input type="number" id="dev-stcs" min="0" max="5" value="${dev.stcs}">
      </div>
    </div>

    <div class="de-section">
      <div class="de-section-label">Personal Stars</div>
      <div class="de-field">
        <label for="dev-stg">Gold stars</label>
        <input type="number" id="dev-stg" min="0" max="9" value="${dev.stg}">
      </div>
      <div class="de-field">
        <label for="dev-sts">Silver star</label>
        <input type="checkbox" id="dev-sts" ${dev.sts ? 'checked' : ''}>
      </div>
    </div>

    <div class="de-section">
      <div class="de-section-label">Other Devices</div>
      <div class="de-field">
        <label for="dev-knt">Knot clasps</label>
        <input type="number" id="dev-knt" min="0" max="5" value="${dev.knt}">
      </div>
    </div>

    <div class="de-section">
      <div class="de-section-label">Position Override</div>
      <div class="de-field">
        <label for="dev-pos">Apply to OLC / star group</label>
        <select id="dev-pos">
          <option value="auto" ${dev.posOverride === 'auto' ? 'selected' : ''}>Auto</option>
          <option value="c" ${dev.posOverride === 'c' ? 'selected' : ''}>Center</option>
          <option value="l" ${dev.posOverride === 'l' ? 'selected' : ''}>Left</option>
          <option value="r" ${dev.posOverride === 'r' ? 'selected' : ''}>Right</option>
        </select>
      </div>
    </div>
  `;

  // Move buttons
  document.getElementById('de-mv-left').addEventListener('click', () => moveRibbon(-1));
  document.getElementById('de-mv-right').addEventListener('click', () => moveRibbon(1));
  document.getElementById('de-remove').addEventListener('click', () => removeRibbon(rowIdx, colIdx));

  // Device fields
  function bindField(id, key, parseAs) {
    const el = document.getElementById(id);
    el.addEventListener('change', () => {
      let val = parseAs === 'bool' ? el.checked : Math.max(0, parseInt(el.value) || 0);
      if (parseAs === 'str') val = el.value;
      slot.devices[key] = val;
      schedulePreview();
    });
  }
  bindField('dev-vd',    'vd',         'bool');
  bindField('dev-frame', 'frame',      'str');
  bindField('dev-olcb',  'olcb',       'int');
  bindField('dev-olcs',  'olcs',       'bool');
  bindField('dev-stcb',  'stcb',       'int');
  bindField('dev-stcs',  'stcs',       'int');
  bindField('dev-stg',   'stg',        'int');
  bindField('dev-sts',   'sts',        'bool');
  bindField('dev-knt',   'knt',        'int');
  bindField('dev-pos',   'posOverride','str');
}

// ── State actions ────────────────────────────────────────────────────────────

function addRibbon(id) {
  if (state.rows.length === 0) state.rows.push([]);
  const lastRow = state.rows[state.rows.length - 1];
  if (lastRow.length >= state.rowWidth) {
    state.rows.push([]);
  }
  state.rows[state.rows.length - 1].push({ id, devices: defaultDevices() });
  renderRows();
  schedulePreview();
}

function addEmptyRow() {
  state.rows.push([]);
  renderRows();
}

function deleteRow(rowIdx) {
  // If deleting the selected row, clear selection
  if (state.selected && state.selected.rowIdx === rowIdx) state.selected = null;
  // Adjust selection for rows after deleted
  if (state.selected && state.selected.rowIdx > rowIdx) state.selected.rowIdx--;
  state.rows.splice(rowIdx, 1);
  renderRows();
  renderDeviceEditor();
  schedulePreview();
}

function selectRibbon(rowIdx, colIdx) {
  if (state.selected && state.selected.rowIdx === rowIdx && state.selected.colIdx === colIdx) {
    state.selected = null;
  } else {
    state.selected = { rowIdx, colIdx };
  }
  renderRows();
  renderDeviceEditor();
}

function moveRibbon(direction) {
  if (!state.selected) return;
  const { rowIdx, colIdx } = state.selected;
  const allRibbons = state.rows.flat();
  // Find flat index
  let flatIdx = 0;
  for (let r = 0; r < rowIdx; r++) flatIdx += state.rows[r].length;
  flatIdx += colIdx;

  const newFlatIdx = flatIdx + direction;
  if (newFlatIdx < 0 || newFlatIdx >= allRibbons.length) return;

  // Swap
  [allRibbons[flatIdx], allRibbons[newFlatIdx]] = [allRibbons[newFlatIdx], allRibbons[flatIdx]];

  // Rebuild rows preserving sizes
  let i = 0;
  for (let r = 0; r < state.rows.length; r++) {
    const len = state.rows[r].length;
    state.rows[r] = allRibbons.slice(i, i + len);
    i += len;
  }

  // Update selection to follow the moved ribbon
  const newRow = Math.floor(newFlatIdx / 1); // not straightforward — recompute
  let cum = 0;
  let newRowIdx = 0, newColIdx = 0;
  for (let r = 0; r < state.rows.length; r++) {
    if (newFlatIdx < cum + state.rows[r].length) {
      newRowIdx = r;
      newColIdx = newFlatIdx - cum;
      break;
    }
    cum += state.rows[r].length;
  }
  state.selected = { rowIdx: newRowIdx, colIdx: newColIdx };

  renderRows();
  renderDeviceEditor();
  schedulePreview();
}

function removeRibbon(rowIdx, colIdx) {
  state.rows[rowIdx].splice(colIdx, 1);
  state.selected = null;
  renderRows();
  renderDeviceEditor();
  schedulePreview();
}

// ── Settings wiring ──────────────────────────────────────────────────────────

document.getElementById('dsl-branch').addEventListener('change', e => {
  state.branch = e.target.value;
  schedulePreview();
});

// Row width toggle
document.querySelectorAll('[data-rw]').forEach(btn => {
  btn.addEventListener('click', () => {
    state.rowWidth = parseInt(btn.dataset.rw);
    document.querySelectorAll('[data-rw]').forEach(b => b.classList.toggle('active', b === btn));
    renderRows();
    schedulePreview();
  });
});

// Alignment toggle
document.querySelectorAll('[data-ra]').forEach(btn => {
  btn.addEventListener('click', () => {
    state.alignment = btn.dataset.ra;
    document.querySelectorAll('[data-ra]').forEach(b => b.classList.toggle('active', b === btn));
    schedulePreview();
  });
});

// ── Browser wiring ───────────────────────────────────────────────────────────

document.getElementById('search-input').addEventListener('input', renderBrowser);
document.getElementById('branch-filter').addEventListener('change', renderBrowser);

// ── DSL bar actions ──────────────────────────────────────────────────────────

document.getElementById('copy-dsl').addEventListener('click', async () => {
  const dsl = generateDSL();
  if (!dsl) return;
  await navigator.clipboard.writeText(dsl);
  const btn = document.getElementById('copy-dsl');
  btn.textContent = 'Copied!';
  setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
});

document.getElementById('open-in-editor').addEventListener('click', () => {
  const dsl = generateDSL();
  if (!dsl) return;
  window.open(`index.html?dsl=${encodeURIComponent(dsl)}`, '_blank');
});

// Add row button at the bottom of rows area is rendered dynamically in renderRows()

// ── Init ─────────────────────────────────────────────────────────────────────

renderBrowser();
renderRows();
renderDeviceEditor();
renderPreview();
</script>
